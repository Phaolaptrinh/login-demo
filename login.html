<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial;
      }
      .login-box {
        width: 300px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
      }
      input {
        width: 100%;
        margin: 10px -8px;
        padding: 8px;
      }
      button {
        width: 100%;
        padding: 10px;
        border-radius: 999px;
        border: none;
        background: cadetblue;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h3>Login</h3>
      <input type="text" placeholder="Username" />
      <input type="password" placeholder="Password" />
      <button>Login</button>
    </div>
  </body>
</html>
