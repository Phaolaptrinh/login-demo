<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #1e293b;
        --primary: #06b6d4;
        --primary-hover: #0891b2;
        --text: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #334155 0%, var(--bg-1) 45%, #020617 100%);
        display: grid;
        place-items: center;
      }

      .hero {
        text-align: center;
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 4vw, 42px);
      }

      p {
        margin: 0 0 24px;
        color: #cbd5e1;
      }

      .nut {
        min-width: 170px;
        height: 44px;
        background: var(--primary);
        border-radius: 999px;
        color: white;
        font-weight: 700;
        font-size: 1rem;
        border: none;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
      }

      .nut:hover {
        background: var(--primary-hover);
      }

      .nut:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <h1>Login Demo</h1>
      <p>Giao diện đăng nhập hiện đại với kiểm tra dữ liệu phía trình duyệt.</p>
      <button class="nut" onclick="location.href='login.html'">Đi tới đăng nhập</button>
    </main>
  </body>
</html>
